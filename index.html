<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dokumentasi Greder & Compact 31 Hari</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef2f4;margin:0;color:#20342a}header{background:#17583b;color:#fff;text-align:center;padding:16px}main{max-width:1050px;margin:auto;padding:12px}.toolbar{background:white;padding:12px;border-radius:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px}button{background:#176b43;color:white;border:0;border-radius:8px;padding:10px;font-weight:bold}.alt{background:#465e51}.report{background:white;padding:14px;border:1px solid #ccd8d0;border-radius:10px;margin-bottom:14px}.heading{text-align:center;border:2px solid #2c4637;padding:8px;font-weight:bold}.day{text-align:center;font-weight:bold;background:#e4eee7;padding:8px;margin:8px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta label{border:1px solid #c5d1c9;border-radius:6px;padding:8px;font-weight:bold;display:flex;align-items:center;gap:6px}.meta input{width:100%;min-width:0;border:0;padding:5px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.item{border:2px solid #354d3e;border-radius:8px;overflow:hidden}.photoTitle{text-align:center;background:#e5eee7;font-weight:bold;padding:7px}.frame{aspect-ratio:4/3;background:#f4f7f5;position:relative;display:flex;align-items:center;justify-content:center;color:#66766c}.frame img{width:100%;height:100%;object-fit:contain;display:none}.frame input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.fields{padding:9px}.fields label{font-size:13px;font-weight:bold;display:block;margin-top:6px}.fields input{width:100%;padding:8px;border:1px solid #cbd5ce;border-radius:6px}.controls{text-align:center;background:#f7f9f7;padding:6px}.controls button{padding:7px;font-size:12px}.foot{text-align:center;color:#66756c;font-size:11px;margin-top:8px}
@media(max-width:600px){.meta,.photos{grid-template-columns:1fr}}
@media print{@page{size:A4 landscape;margin:8mm}body{background:white;font-size:10pt}header,.toolbar,.frame input,.controls{display:none!important}main{max-width:none;padding:0}.report{margin:0;padding:0;border:0;border-radius:0;page-break-after:always;break-after:page}.report:last-child{page-break-after:auto;break-after:auto}.heading{font-size:14pt;padding:5px}.day{margin:5px 0;padding:4px}.meta{gap:5px}.meta label{padding:4px}.photos{gap:6px}.item{break-inside:avoid;page-break-inside:avoid}.frame{aspect-ratio:4/3;max-height:95mm}.frame img{display:block!important}.fields{padding:5px}.fields label{display:inline-block;width:32%;margin:3px 0}.fields input{display:inline-block;width:66%;border:0;padding:2px}.foot{margin-top:4px}}
</style></head><body><header><h2 style="margin:0">DOKUMENTASI PEKERJAAN GREDER DAN COMPACT</h2><p style="margin:6px 0 0">Gabungan Tanggal 01–31 • 2 Foto setiap tanggal</p></header>
<main><div class="toolbar"><button onclick="window.print()">Export / Cetak PDF • Semua 31 Hari</button><button class="alt" onclick="exportExcel()">Export Excel • Semua 31 Hari</button><button class="alt" onclick="saveData()">Simpan Data</button></div><div id="root"></div></main>
<script>
const KEY="greder_combined_2photos_v2";
let data=Array.from({length:31},()=>({company:"",date:"",photos:[blank(),blank()]}));
function blank(){return {src:"",name:"",block:"",job:""}}
const root=document.getElementById("root");
function build(){root.innerHTML="";for(let d=0;d<31;d++){const sec=document.createElement("section");sec.className="report";sec.dataset.day=d;sec.innerHTML=`<div class="heading">DOKUMENTASI PEKERJAAN GREDER DAN COMPACT</div><div class="day">DOKUMENTASI TANGGAL ${String(d+1).padStart(2,"0")}</div><div class="meta"><label>PT / DIVISI <input data-meta="company" placeholder="PT / Divisi"></label><label>TANGGAL <input type="date" data-meta="date"></label></div><div class="photos">${[1,2].map(n=>`<div class="item"><div class="photoTitle">FOTO ${n}</div><div class="frame"><span class="hint">Pilih / masukkan foto ${n}</span><img id="im${d}_${n}"><input type="file" accept="image/*" data-p="${n}"></div><div class="controls"><button class="alt" data-clear="${n}">Hapus Foto</button></div><div class="fields"><label>Nama alat</label><input data-field="name" placeholder="Nama alat"><label>Lokasi / Blok</label><input data-field="block" placeholder="Lokasi / Blok"><label>Jenis pekerjaan</label><input data-field="job" placeholder="Jenis pekerjaan"></div></div>`).join("")}</div><div class="foot">Dokumentasi Greder & Compact • Tanggal ${String(d+1).padStart(2,"0")}</div>`;
root.append(sec);sec.querySelectorAll("[data-meta]").forEach(el=>el.oninput=()=>{data[d][el.dataset.meta]=el.value;saveData()});sec.querySelectorAll("[data-p]").forEach(el=>el.onchange=e=>handleFile(e,d,+el.dataset.p));sec.querySelectorAll("[data-field]").forEach(el=>el.oninput=()=>{let n=+el.closest(".item").querySelector("[data-p]").dataset.p;data[d].photos[n-1][el.dataset.field]=el.value;saveData()});sec.querySelectorAll("[data-clear]").forEach(el=>el.onclick=()=>clearPhoto(d,+el.dataset.clear))}}
function handleFile(e,d,n){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>compress(reader.result,1500,.78,res=>{data[d].photos[n-1].src=res;render(d,n);saveData()});reader.readAsDataURL(file)}
function compress(src,max,q,cb){let im=new Image();im.onload=()=>{let ratio=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*ratio));c.height=Math.max(1,Math.round(im.height*ratio));c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",q))};im.onerror=()=>cb(src);im.src=src}
function render(d,n){let sec=root.querySelector(`[data-day="${d}"]`),p=data[d].photos[n-1],item=sec.querySelectorAll(".item")[n-1],img=item.querySelector("img"),hint=item.querySelector(".hint");img.src=p.src||"";img.style.display=p.src?"block":"none";hint.style.display=p.src?"none":"block";item.querySelectorAll("[data-field]").forEach(el=>el.value=p[el.dataset.field]||"")}
function clearPhoto(d,n){data[d].photos[n-1]=blank();render(d,n);saveData()}
function saveData(){data.forEach((r,d)=>{let sec=root.querySelector(`[data-day="${d}"]`);if(!sec)return;r.company=sec.querySelector('[data-meta="company"]').value;r.date=sec.querySelector('[data-meta="date"]').value});try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Penyimpanan penuh. Coba foto yang lebih kecil.")}}
function exportExcel(){saveData();const esc=t=>String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const tabs=data.map((r,d)=>`<table border="1" cellpadding="5" style="border-collapse:collapse;width:100%;margin-bottom:18px"><tr><th colspan="2" style="background:#dce9df">DOKUMENTASI TANGGAL ${String(d+1).padStart(2,"0")}</th></tr><tr><td>PT / DIVISI</td><td>${esc(r.company)}</td></tr><tr><td>TANGGAL</td><td>${esc(r.date)}</td></tr><tr>${r.photos.map((p,i)=>`<td style="width:50%;vertical-align:top"><b>FOTO ${i+1}</b><br>${p.src?`<img src="${p.src}" width="360" height="270">`:"Foto belum diisi"}<br><b>Nama alat:</b> ${esc(p.name)}<br><b>Lokasi / Blok:</b> ${esc(p.block)}<br><b>Jenis pekerjaan:</b> ${esc(p.job)}</td>`).join("")}</tr></table>`).join("");const wb=`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><h2>Dokumentasi Greder & Compact 31 Hari</h2>${tabs}</body></html>`;const blob=new Blob(["\\ufeff",wb],{type:"application/vnd.ms-excel"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Dokumentasi_Greder_31Hari.xls";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
build();try{const saved=localStorage.getItem(KEY);if(saved){const loaded=JSON.parse(saved);if(Array.isArray(loaded)&&loaded.length===31)data=loaded.map(r=>({company:r.company||"",date:r.date||"",photos:[0,1].map(i=>r.photos?.[i]||blank())}))}}catch(e){}data.forEach((r,d)=>{let sec=root.querySelector(`[data-day="${d}"]`);sec.querySelector('[data-meta="company"]').value=r.company||"";sec.querySelector('[data-meta="date"]').value=r.date||"";render(d,1);render(d,2)});
</script></body></html>
